<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HPSocial — Hospitality Professionals Social</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; background:#0a1a2c; color:#12263f; }
  #col { max-width:560px; margin:0 auto; min-height:100vh; background:#eef2f7; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,.5); }

  .appbar .t b { color:#c9a227; }
  .appbar .who { margin-left:auto; text-align:right; font-size:12px; color:#aebfd2; font-weight:700; line-height:1.35; }

  .card { background:#fff; border-radius:18px; padding:18px; margin-top:18px; box-shadow:0 3px 14px rgba(13,33,56,.09); }
  .tabs { display:flex; gap:8px; }

  .bigbtn:active { transform:scale(.99); }

  .err { color:#b3261e; font-weight:700; font-size:14px; margin-top:10px; text-align:center; }

  .hresults .hm { color:#8496ab; font-size:12.5px; font-weight:700; }
  .hpicked { background:#fdf6e0; border:1.5px solid #c9a227; border-radius:12px; padding:11px 12px; font-weight:800; }
  .hpicked .hm { color:#7a5b12; font-size:12.5px; font-weight:700; }

  .crow { display:flex; gap:9px; margin-top:9px; }
  .crow select { flex:1; }
  .crow .post { flex:0 0 auto; border:0; border-radius:11px; padding:0 22px; background:#c9a227; color:#12263f; font-weight:900; font-size:15px; cursor:pointer; }
  .filters { display:flex; gap:7px; margin:13px 0 3px; overflow-x:auto; padding-bottom:2px; }

  .jobtag { display:inline-block; background:#c9a227; color:#12263f; font-size:11px; font-weight:900; letter-spacing:1.2px; padding:3px 9px; border-radius:999px; margin-bottom:6px; }
  .jobrole { font-family:Georgia,serif; font-size:19px; font-weight:700; }
  .shoutto { color:#7a5b12; font-weight:800; font-size:13.5px; margin-top:2px; }
  .pbar { display:flex; gap:16px; margin-top:11px; padding-top:10px; border-top:1px solid #e6ecf3; font-size:13.5px; font-weight:800; color:#54687e; align-items:center; }

  .pbar .liked { color:#a8842a; }
  .pbar .rep { margin-left:auto; font-size:12px; color:#a8b8c8; }
  .intbtn { margin-left:auto; border:0; background:#0d2138; color:#fff; border-radius:9px; padding:7px 14px; font-weight:800; font-size:13px; cursor:pointer; }
  .intbtn.on { background:#2e7d32; }
  .applybtn { display:block; width:100%; margin:10px 0 2px; border:0; background:#0f2c4c; color:#fff; border-radius:10px; padding:11px; font-weight:800; font-size:14.5px; cursor:pointer; font-family:inherit; }
  .applybtn.done { background:#2e7d32; }
  .likenames { font-size:12px; color:#a8842a; font-weight:700; margin-top:6px; }
  .cmts { margin-top:9px; }
  .cmt { display:flex; gap:8px; margin-top:8px; font-size:14px; line-height:1.45; }
  .cmt .cb { background:#f2f5f9; border-radius:12px; padding:7px 11px; flex:1; }
  .cmt .cb b { font-size:13.5px; }
  .cmt .cw { color:#8496ab; font-size:11.5px; font-weight:700; }
  .cmt .cdel { border:0; background:none; color:#b3261e; font-size:13px; cursor:pointer; align-self:flex-start; }
  .cbox { display:flex; gap:8px; margin-top:10px; }
  .cbox input { flex:1; padding:9px 12px; font-size:14.5px; border-radius:999px; }
  .cbox button { border:0; background:#0d2138; color:#fff; border-radius:999px; padding:0 17px; font-weight:800; font-size:14px; cursor:pointer; }
  /* people + profile */
  .member { background:#fff; border-radius:16px; padding:13px; margin-top:10px; display:flex; gap:11px; align-items:center; box-shadow:0 2px 8px rgba(13,33,56,.06); cursor:pointer; }

  .badge { display:inline-block; font-size:10.5px; font-weight:900; letter-spacing:.8px; padding:2.5px 8px; border-radius:999px; text-transform:uppercase; }
  .badge.act { background:#dcefe0; color:#2e7d32; }
  .badge.bet { background:#f6ddb8; color:#7a4a12; }
  .badge.pau { background:#e3e7ec; color:#54687e; }
  .connbtn { margin-left:auto; border:0; border-radius:10px; padding:9px 15px; font-weight:900; font-size:13.5px; background:#c9a227; color:#12263f; cursor:pointer; flex:0 0 auto; }
  .connbtn.on { background:#e3eaf2; color:#54687e; }
  .cover { height:118px; border-radius:18px 18px 0 0; background:linear-gradient(120deg,#0d2138,#1d4066 60%,#c9a227 160%); margin:-12px -12px 0; position:relative; }
  .coverbtn { position:absolute; right:10px; bottom:10px; background:rgba(255,255,255,.94); border:0; border-radius:999px; padding:7px 13px; font-weight:800; font-size:12.5px; color:#12263f; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.28); }
  .coverbtn.ghost { right:172px; background:rgba(13,33,56,.55); color:#fff; }
  .profcard { background:#fff; border-radius:0 0 18px 18px; padding:0 16px 16px; box-shadow:0 2px 8px rgba(13,33,56,.08); }
  .bigava { overflow:hidden; width:82px; height:82px; border-radius:50%; border:4px solid #fff; margin-top:-41px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; color:#fff; position:relative; }
  .profname { font-family:Georgia,serif; font-size:25px; font-weight:700; margin-top:7px; }
  .phead { font-size:15.5px; color:#33506e; margin-top:3px; line-height:1.45; }
  .otw { display:inline-block; background:#e7f7ec; color:#177245; border:1.5px solid #7ed492; border-radius:999px; padding:2.5px 10px; font-size:12.5px; font-weight:800; vertical-align:middle; }
  .exrow { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid #e7edf3; align-items:flex-start; }
  .exrow:last-child { border-bottom:none; }
  .skchip { display:inline-flex; align-items:center; gap:7px; background:#f2f6fb; border:1.5px solid #cfdce9; border-radius:999px; padding:5px 6px 5px 12px; margin:0 6px 8px 0; font-size:13.5px; font-weight:700; color:#29425e; }
  .skchip b { background:#0f2c4c; color:#f4c95d; border-radius:999px; padding:1px 8px; font-size:12px; }
  .skchip button { border:none; border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:800; cursor:pointer; background:#0f2c4c; color:#fff; font-family:inherit; }
  .skchip button.on { background:#2e9e4f; }
  .skchip button.skx { background:transparent; color:#8496ab; padding:2px 5px; }
  .career-inp { width:100%; border:1.5px solid #cfdce9; border-radius:10px; padding:11px 12px; font-size:15px; box-sizing:border-box; background:#fff; font-family:inherit; }
  .stats { display:flex; margin-top:13px; border-top:1px solid #e6ecf3; padding-top:11px; }
  .stats div { flex:1; text-align:center; }
  .stats b { font-size:19px; display:block; }
  .stats span { font-size:10px; color:#8496ab; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
  .secttl { font-size:12.5px; letter-spacing:1.5px; color:#a8842a; text-transform:uppercase; font-weight:900; margin:18px 0 4px; }
  .pausedbox { background:#12263f; color:#fff; border-radius:18px; padding:24px 20px; text-align:center; margin-top:16px; }
  .pausedbox h2 { font-family:Georgia,serif; font-size:24px; margin-bottom:8px; }
  .pausedbox p { color:#aebfd2; line-height:1.55; font-size:15px; }
  /* tabbar */
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:560px; background:#fff; border-top:1px solid #dbe5ef; display:flex; z-index:50; padding-bottom:env(safe-area-inset-bottom); }
  .tabbar button { flex:1; border:0; background:none; padding:9px 0 11px; font-size:11px; font-weight:800; color:#8496ab; cursor:pointer; }
  .tabbar button .ic { display:block; font-size:21px; margin-bottom:1px; }
  .tabbar button.on { color:#a8842a; }
  /* Facebook-style gate */
  .gatefb { padding:30px 18px 44px; }
  .gatefb .mark { width:76px; height:76px; border-radius:20px; display:block; margin:4px auto 10px; box-shadow:0 10px 24px rgba(13,33,56,.28); }
  .gatefb h1 { font-family:Georgia,serif; text-align:center; font-size:36px; }
  .gatefb h1 b { color:#a8842a; }
  .gatefb .tag { text-align:center; color:#29425e; font-size:16.5px; margin-top:6px; line-height:1.45; }
  .fbcard { background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(13,33,56,.14), 0 8px 30px rgba(13,33,56,.08); padding:20px 18px 22px; margin-top:22px; }
  .fbcard h2 { font-size:21px; text-align:center; font-weight:800; }
  .fbcard .fsub { text-align:center; color:#8496ab; font-size:14px; margin-top:3px; }
  .fbcard input, .fbcard select, .fbcard textarea { margin-top:12px; border-radius:9px; }
  .fblogin { width:100%; border:0; border-radius:9px; padding:13px; font-size:17.5px; font-weight:900; background:#0d2138; color:#fff; cursor:pointer; margin-top:16px; }
  .fbcreate { display:block; width:fit-content; margin:4px auto 0; border:0; border-radius:9px; padding:12px 22px; font-size:16px; font-weight:900; background:#c9a227; color:#12263f; cursor:pointer; }
  .fblink { display:block; text-align:center; color:#a8842a; font-weight:700; font-size:14.5px; margin-top:14px; text-decoration:none; cursor:pointer; }

  .fbdiv:before, .fbdiv:after { content:''; flex:1; border-top:1px solid #dbe5ef; }
  .selfiebox { border:2px dashed #c9a227; background:#fffdf4; border-radius:14px; padding:14px; margin-top:14px; text-align:center; }
  .selfiebox img { width:110px; height:110px; border-radius:50%; object-fit:cover; display:block; margin:0 auto 8px; border:3px solid #c9a227; }
  .selfiebox .sb-t { font-weight:900; font-size:15px; }
  .selfiebox .sb-s { color:#54687e; font-size:13px; margin-top:3px; line-height:1.45; }
  .selfiebox button { border:0; border-radius:10px; padding:11px 20px; font-weight:900; font-size:14.5px; background:#0d2138; color:#fff; cursor:pointer; margin-top:9px; }
  .hhead { display:flex; gap:12px; align-items:center; background:#0d2138; color:#fff; border-radius:16px; padding:14px 16px; }
  .hhead .hbell { width:46px; height:46px; border-radius:50%; background:#c9a227; display:flex; align-items:center; justify-content:center; font-size:23px; flex:none; }
  .hhead .ht { font-weight:900; font-size:17px; }
  .hhead .hs { color:#b8c7d9; font-size:12.5px; margin-top:1px; }
  .hmsgs { display:flex; flex-direction:column; gap:9px; margin:14px 0; }
  .hbub { max-width:86%; padding:11px 13px; border-radius:15px; font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .hbub.bot { background:#fff; border:1px solid #dfe6ee; border-left:4px solid #c9a227; align-self:flex-start; border-bottom-left-radius:5px; }
  .hbub.me { background:#0d2138; color:#fff; align-self:flex-end; border-bottom-right-radius:5px; }
  .hchips { display:flex; flex-wrap:wrap; gap:7px; margin:4px 0 10px; }
  .hchips button { border:1.5px solid #c9a227; background:#fffdf4; color:#7a5b12; border-radius:999px; padding:8px 12px; font-weight:800; font-size:13px; cursor:pointer; }
  .hrow { display:flex; gap:8px; }
  .hrow input { flex:1; border:1.5px solid #d9dee5; border-radius:12px; padding:12px; font-size:15px; min-width:0; }
  .hrow button { border:0; border-radius:12px; padding:12px 18px; font-weight:900; background:#c9a227; color:#231a00; cursor:pointer; }

  .hback { display:inline-block; margin-bottom:10px; color:#29425e; font-weight:800; font-size:14px; cursor:pointer; }
  .fbjoin { width:100%; border:0; border-radius:9px; padding:13px; font-size:16.5px; font-weight:900; background:#c9a227; color:#12263f; cursor:pointer; margin-top:16px; }
  .empty { text-align:center; color:#8496ab; padding:34px 20px; font-size:15px; line-height:1.6; }
  .ava img, .bigava img { width:100%; height:100%; object-fit:cover; display:block; }
  .foot { text-align:center; color:#8496ab; font-size:12px; padding:6px 0 16px; font-weight:700; }

  /* opening splash — ringing bell */
  #splash { position:fixed; inset:0; z-index:999; background:linear-gradient(160deg,#0d2138,#122e4d); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .45s ease; cursor:pointer; }
  #splash.gone { opacity:0; pointer-events:none; }
  #splash .ringwrap { position:relative; width:158px; height:158px; display:flex; align-items:center; justify-content:center; }
  #splash .ringwrap:before, #splash .ringwrap:after { content:''; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(201,162,39,.55); animation:hpsPing 1.5s ease-out infinite; }
  #splash .ringwrap:after { animation-delay:.5s; }
  @keyframes hpsPing { 0% { transform:scale(.55); opacity:.9; } 100% { transform:scale(1.28); opacity:0; } }
  #splashBell { width:118px; height:118px; border-radius:28px; box-shadow:0 16px 40px rgba(0,0,0,.45); transform-origin:50% 6%; animation:hpsSwing 1.5s ease-in-out; }
  @keyframes hpsSwing { 0% { transform:rotate(0deg); } 12% { transform:rotate(17deg); } 30% { transform:rotate(-14deg); } 48% { transform:rotate(10deg); } 64% { transform:rotate(-7deg); } 80% { transform:rotate(4deg); } 100% { transform:rotate(0deg); } }
  #splash .st { font-family:Georgia,serif; font-size:34px; color:#fff; }
  #splash .st b { color:#c9a227; }
  #splash .ss { color:#b8c7d9; font-size:14.5px; font-weight:700; letter-spacing:.4px; }
  #splash .shint { color:#e9d9a0; font-size:13.5px; font-weight:800; letter-spacing:.3px; opacity:0; transition:opacity .4s ease; }
  #splash .shint.show { opacity:1; animation:hpsPulse 1.2s ease-in-out infinite; }
  #introVid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#0d2138; }
  #introSkip { position:absolute; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom)); text-align:center; color:#e9d9a0; font-size:13.5px; font-weight:800; letter-spacing:.3px; text-shadow:0 1px 8px rgba(0,0,0,.65); pointer-events:none; }
  #introSnd { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(58px + env(safe-area-inset-bottom)); z-index:3; border:2px solid #c9a227; background:#0f2c4c; color:#fff; border-radius:999px; padding:12px 20px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; box-shadow:0 6px 18px rgba(0,0,0,.45); white-space:nowrap; }
  @keyframes hpsPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.07); } }
  @media (prefers-reduced-motion: reduce) { #splashBell { animation:none; } #splash .ringwrap:before, #splash .ringwrap:after { animation:none; display:none; } }

  /* gate: hotel photo backdrop + safety note */
  body.gatebg #col { background:linear-gradient(rgba(238,242,247,.87), rgba(238,242,247,.80)), url('hotel-bg.jpg') center top / cover no-repeat #eef2f7; }
  .safenote { margin-top:18px; padding-top:14px; border-top:1px solid #e3eaf2; text-align:center; color:#54687e; font-size:12.5px; line-height:1.55; font-weight:600; }
</style>
</head>
<body>
<div id="splash"><video id="introVid" src="intro.mp4" autoplay muted playsinline preload="auto" poster="bell-mark.png"></video><button id="introSnd" onclick="event.stopPropagation();introSound(this)">🔇 Sound OFF — tap for sound</button><div id="introSkip">Tap anywhere to skip</div></div>
<div id="col">
  <div class="appbar"><img src="bell-mark.png" alt=""><div class="t"><b>HPS</b>ocial</div><div class="who" id="whoami"></div></div>
  <div class="sync" id="syncbadge">● Connecting…</div>
  <div id="main"></div>

function jobLocText(p){

  var first = (p.text || '').split('\n')[0] || '';
  var i = first.indexOf('\u2014');
  return i >= 0 ? first.slice(i + 1).trim() : '';
}
function jobDist(p){
  if (!pin) return null;
  if (typeof p.lat === 'number' && typeof p.lng === 'number') return havMi(pin.lat, pin.lng, p.lat, p.lng);
  var g = geoCacheGet(jobLocText(p));
  return g ? havMi(pin.lat, pin.lng, g.lat, g.lng) : null;
}
function pinFromDevice(){
  if (!navigator.geolocation) { alert('This device cannot share its location. Use Set city instead.'); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    pin = { lat: pos.coords.latitude, lng: pos.coords.longitude, label: 'Your location' };
    try { localStorage.setItem('hps-pin', JSON.stringify(pin)); } catch (e) {}
    render();
  }, function(){ alert('Location was not shared. You can set a city instead.'); }, { timeout: 10000 });
}
async function pinFromCity(){
  var c = prompt('Show jobs near which city? (City, State \u2014 or a ZIP code)');
  if (!c || !c.trim()) return;
  var g = await geocodeCity(c.trim());
  if (!g) { alert('Could not find that place \u2014 try City, State.'); return; }
  pin = { lat: g.lat, lng: g.lng, label: c.trim() };
  try { localStorage.setItem('hps-pin', JSON.stringify(pin)); } catch (e) {}
  render();
}
function pinClear(){ pin = null; pinRadius = 0; try { localStorage.removeItem('hps-pin'); } catch (e) {} render(); }

function snapFile(inp, cb){
  var f = inp.files && inp.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var raw = rd.result;
    try {
      var img = new Image();
      img.onload = function(){
        try {
          var max = 320, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
          var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          cb(cv.toDataURL('image/jpeg', 0.85));
        } catch (e) { cb(raw); }
      };
      img.onerror = function(){ cb(raw); };
      img.src = raw;
    } catch (e) { cb(raw); }
  };
  rd.readAsDataURL(f);
}

  var p = S.posts.filter(function(x){ return x.id === id; })[0]; if (!p) return;
  p.comments = p.comments || [];
  p.comments.push({ uid: me.id, n: me.name, t: Date.now(), text: text }); p.commentsTs = Date.now();
  drafts['c-' + id] = ''; await push(); render();
  var c = document.getElementById('post-' + id); if (c) c.scrollIntoView({ block: 'center' });
}
async function delComment(pid, ci){
  var p = S.posts.filter(function(x){ return x.id === pid; })[0]; if (!p || !confirm('Delete this comment?')) return;
  p.comments.splice(ci, 1); p.commentsTs = Date.now(); await push(); render();
}
async function delPost(id){
  if (!confirm('Delete this post?')) return;
  S.posts = S.posts.filter(function(x){ return x.id !== id; }); await push(); render();
}
async function reportPost(id){
  var p = S.posts.filter(function(x){ return x.id === id; })[0]; if (!p) return;
  if (!confirm('Report this post to the HPSocial moderators?')) return;
  p.reports = p.reports || []; if (p.reports.indexOf(me.id) < 0) p.reports.push(me.id);
  await push(); render(); alert('Reported — thank you. Our moderators will take a look.');
}
async function toggleConnect(id){
  var other = memberById(id); if (!other) return;
  var i = me.connections.indexOf(id);
  if (i >= 0) { me.connections.splice(i, 1); var j = other.connections.indexOf(me.id); if (j >= 0) other.connections.splice(j, 1); }
  else { me.connections.push(id); if (other.connections.indexOf(me.id) < 0) other.connections.push(me.id); }
  me.u = Date.now(); other.u = Date.now(); await push(); render();
}


/* ============ Messenger ============ */
var msgWith = null, msgDraft = '';
function unreadCount(){ return (S.msgs || []).filter(function(g){ return g.to === me.id && !g.read; }).length; }
function unreadFrom(id){ return (S.msgs || []).filter(function(g){ return g.to === me.id && g.from === id && !g.read; }).length; }
function lastMsgWith(id){
  var list = (S.msgs || []).filter(function(g){ return (g.from === me.id && g.to === id) || (g.from === id && g.to === me.id); });
  return list.length ? list[list.length - 1] : null;
}
async function openThread(id){
  msgWith = id; msgDraft = '';
  var changed = false;
  (S.msgs || []).forEach(function(g){ if (g.from === id && g.to === me.id && !g.read) { g.read = true; changed = true; } });
  view = 'thread'; profileOf = null; render(); window.scrollTo(0, 0);
  if (changed) { await push(); saveCache(); }
}
function renderMsgs(){
  var partners = {};
  (S.msgs || []).forEach(function(g){ if (g.from === me.id) partners[g.to] = 1; if (g.to === me.id) partners[g.from] = 1; });
  var ids = Object.keys(partners).filter(function(id){ return memberById(id); });
  ids.sort(function(x, y){ var lx = lastMsgWith(x), ly = lastMsgWith(y); return ((ly && ly.ts) || 0) - ((lx && lx.ts) || 0); });
  var h = '<div class="view"><div class="secttl" style="margin-top:2px">💬 Messages</div>';
  if (ids.length) {
    h += ids.map(function(id){
      var m = memberById(id), last = lastMsgWith(id), un = unreadFrom(id);
      return '<div class="member" onclick="openThread(\'' + id + '\')">' + ava(m)
        + '<div style="flex:1;min-width:0"><div class="pnm" style="font-size:15.5px">' + esc(m.name) + '</div>'
        + '<div class="pmeta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (last ? (last.from === me.id ? 'You: ' : '') + esc(last.text) : '') + '</div></div>'
        + '<div style="text-align:right;flex:none">' + (last ? '<div style="color:#8496ab;font-size:11.5px">' + ago(last.ts) + '</div>' : '') + (un ? '<div class="nbadge" style="position:static;margin-top:4px">' + un + '</div>' : '') + '</div></div>';
    }).join('');
  } else {
    h += '<div class="empty">No conversations yet. Message someone below, or tap 💬 Message on any profile.</div>';
  }
  var others = S.members.filter(function(m){ return m.id !== me.id && m.status !== 'paused' && m.status !== 'blocked' && !partners[m.id]; });
  if (others.length) {
    h += '<div class="secttl">Start a chat</div>' + others.map(function(m){
      var hh = hotelById(m.hotelId);
      return '<div class="member" onclick="openThread(\'' + m.id + '\')">' + ava(m)
        + '<div><div class="pnm" style="font-size:15.5px">' + esc(m.name) + '</div><div class="pmeta">' + esc(m.role) + ' · ' + (hh ? esc(hh.name) : '') + '</div></div></div>';
    }).join('');
  }
  h += '<div class="foot">Private chats between HPSocial members.</div></div>';
  return h;
}
function renderThread(){
  var m = memberById(msgWith);
  if (!m) return '<div class="view"><div class="empty">Conversation not found.</div></div>';
  var list = (S.msgs || []).filter(function(g){ return (g.from === me.id && g.to === m.id) || (g.from === m.id && g.to === me.id); });
  var h = '<div class="view"><a class="hback" onclick="go(\'msgs\')">← All chats</a>'
    + '<div class="hhead" style="cursor:pointer" onclick="openProfile(\'' + m.id + '\')">' + ava(m) + '<div><div class="ht">' + esc(m.name) + '</div><div class="hs">' + esc(m.role) + ' · ' + esc((hotelById(m.hotelId) || {}).name || '') + '</div></div></div>'
    + '<div class="hmsgs">'
    + (list.length ? list.map(function(g){ return '<div class="hbub ' + (g.from === me.id ? 'me' : 'bot') + '">' + esc(g.text) + '<div style="font-size:10.5px;opacity:.65;margin-top:3px">' + ago(g.ts) + (g.from === me.id && g.read ? ' · Seen' : '') + '</div></div>'; }).join('') : '<div class="empty">Say hello to ' + esc(firstName(m.name)) + ' 👋</div>')
    + '</div>'
    + '<div class="hrow"><input id="msg-in" placeholder="Message ' + esc(firstName(m.name)) + '…" value="' + esc(msgDraft) + '" oninput="msgDraft=this.value" onkeydown="if(event.key===\'Enter\')sendMsg()"><button onclick="sendMsg()">Send</button></div>'
    + '</div>';
  setTimeout(function(){ window.scrollTo(0, document.body.scrollHeight); var i = document.getElementById('msg-in'); if (i && msgDraft) i.focus(); }, 30);
  return h;
}
async function sendMsg(){
  var i = document.getElementById('msg-in'); if (!i) return;
  var t = i.value.trim(); if (!t || !msgWith) return;
  if (!S.msgs) S.msgs = [];
  S.msgs.push({ id: uid('g'), from: me.id, to: msgWith, text: t, ts: Date.now(), read: false });
  msgDraft = ''; await push(); saveCache(); render();
}

/* ============ render & boot ============ */
function render(){
  whoami();
  try { document.body.classList.toggle('gatebg', !me); } catch (e) {}
  if (!S) { document.getElementById('main').innerHTML = '<div class="empty">Loading HPSocial…</div>'; return; }
  if (!me) { if (gateHelp) { document.getElementById('main').innerHTML = renderHelp(); return; } renderGate(); return; }
  if (view === 'return') { document.getElementById('main').innerHTML = renderReturn() + tabbar(); return; }
  if (me.status === 'paused') { document.getElementById('main').innerHTML = renderPaused() + tabbar(); return; }
  if (me.status === 'blocked') { document.getElementById('main').innerHTML = renderBlocked() + tabbar(); return; }
  var h = '';
  if (profileOf || view === 'profile') h = renderProfile();
  else if (view === 'people') h = renderPeople();
  else if (view === 'jobs') h = renderJobs();
  else if (view === 'help') h = renderHelp();
  else if (view === 'msgs') h = renderMsgs();
  else if (view === 'thread') h = renderThread();
  else h = renderFeed();
  document.getElementById('main').innerHTML = h + tabbar();
}
window.hpsRender = render;
setInterval(function(){ if (me && document.visibilityState === 'visible') pull(); }, 30000);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && me) pull(); });
(async function boot(){
  try { if (localStorage.getItem('hps-v') !== '3') { localStorage.removeItem('hps-cache'); localStorage.removeItem('hps-me'); localStorage.setItem('hps-v', '3'); } } catch (e) {}
  loadCache(); if (S && !S.msgs) S.msgs = [];
  var savedMe = null;
  try { savedMe = localStorage.getItem('hps-me'); } catch (e) {}
  if (S && savedMe) me = memberById(savedMe);
  render();
  try {
    var c = await sbGet();
    if (c) S = unionState(S, c);
    else { if (!S) S = seedState(); await sbSet(S); }
    if (savedMe) me = memberById(savedMe) || me;
    saveCache(); setBadge(); render();
  } catch (e) {
    if (!S) S = seedState();
    if (savedMe) me = memberById(savedMe) || me;
    saveCache();
    var b = document.getElementById('syncbadge'); b.textContent = '● Offline — showing saved copy'; b.className = 'sync off';
    render();
  }
})();

/* ---- opening splash: swinging bell + ring ---- */
var splashDone = false;
var hpsGesture = false;
function hideSplash(){
  if (splashDone) return; splashDone = true;
  var s = document.getElementById('splash'); if (!s) return;
  s.classList.add('gone');
  setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 500);
}
function introSound(btn){
  var v = document.getElementById('introVid'); if (!v) return;
  v.muted = !v.muted;
  if (!v.muted) { try { var pr = v.play(); if (pr && pr.catch) pr.catch(function(){}); } catch (e) {} }
  btn.textContent = v.muted ? '\uD83D\uDD07 Sound OFF — tap for sound' : '\uD83D\uDD0A Sound ON — tap to mute';
}
(function splash(){
  var s = document.getElementById('splash'); if (!s) return;
  var seen = false;
  try { seen = !!sessionStorage.getItem('hps-intro'); sessionStorage.setItem('hps-intro', '1'); } catch (e) {}
  if (seen) { hideSplash(); return; }
  s.addEventListener('click', hideSplash);
  var v = document.getElementById('introVid');
  if (v) {
    v.muted = true; v.defaultMuted = true;
    v.addEventListener('ended', hideSplash);
    v.addEventListener('error', hideSplash, true);
    try { var pr = v.play(); if (pr && pr.catch) pr.catch(function(){}); } catch (e) {}
  } else hideSplash();
  setTimeout(hideSplash, 11000);
})();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
